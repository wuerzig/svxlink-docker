services:
  svxlink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svxlink
    restart: unless-stopped
    # privileged: true

    ports:
      - "5300:5300"   # svxreflectors
      - "5198:5198/udp"   # EchoLink
      - "5199:5199/udp"   # EchoLink
      - "5200:5200/tcp"   # EchoLink


    environment:
      - TZ=Europe/Paris
      - START_SVXLINK=1
      - START_REMOTETRX=0
      - START_SVXREFLECTOR=0

      - SVXLINK_CONF=/etc/svxlink/svxlink.conf
      - REMOTETRX_CONF=/etc/svxlink/remotetrx.conf
      - SVXREFLECTOR_CONF=/etc/svxlink/svxreflector.conf
      
      - SVXLINK_ARGS=
      - REMOTETRX_ARGS=
      - SVXREFLECTOR_ARGS=

      # --- DJspot SA818 frequency seed (one-shot at startup; module is sticky) ---
      - DJSPOT_SET_FREQ=1
      - DJSPOT_TX_FREQ=433.1250   # MHz
      - DJSPOT_RX_FREQ=433.1250   # MHz
      - DJSPOT_BW=0               # 0=12.5kHz narrow, 1=25kHz wide (clone is narrow-only)
      - DJSPOT_TX_CTCSS=0         # CTCSS index, plain integer (e.g. 18); 0=no tone
      - DJSPOT_RX_CTCSS=0
      - DJSPOT_SQL=4              # squelch 0-8 (0=always open on this clone)
      - DJSPOT_POWER=1            # 7th DMOSETGROUP field (clone dialect): 1=high, 0=low
      # - DJSPOT_VOLUME=6         # optional AT+DMOSETVOLUME seed
      # - DJSPOT_SERIAL=/dev/ttyUSB0  # pin a port instead of auto-detecting

    volumes:
      # Config
      - ./config/etc/svxlink:/etc/svxlink
      - ./config/usr/share/svxlink:/usr/share/svxlink
      # - ./config/share/sounds:/usr/share/svxlink/sounds

      # Logs (optionnel)
      - ./logs:/var/log/svxlink

      # Données (optionnel)
      - ./data:/var/lib/svxlink

    # Sound card and GPIO access (optionnel)
    devices:
     - /dev/snd:/dev/snd
     - /dev/hidraw-radio:/dev/hidraw0
     # DJspot CH341 UARTs (SA818 control). Both identical 1a86:7522 ports are
     # mapped in; djspot-set-freq.sh auto-detects which one is the SA818 via
     # AT+DMOCONNECT. Adjust the host paths if enumeration differs.
     - /dev/ttyUSB0:/dev/ttyUSB0
     - /dev/ttyUSB1:/dev/ttyUSB1
      # - /dev/gpiochip0:/dev/gpiochip0

    # (Optionnel) USB/RTL-SDR
    #   - /dev/bus/usb:/dev/bus/usb
